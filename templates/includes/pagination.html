{% load query_transform %}
{% if is_paginated %}
<ul class="pagination">

  {% if page_obj.has_previous %}
    <li class="page-item">
      <a href="?{% query_transform request page=page_obj.previous_page_number %}" class="page-link">Prev</a>
    </li>
  {% endif %}

  <li class="page-item active" id="page-display">
    <span class="page-link" style="cursor: pointer;">
      {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}
    </span>
  </li>

  {% if page_obj.has_next %}
    <li class="page-item">
      <a href="?{% query_transform request page=page_obj.next_page_number %}" class="page-link">Next</a>
    </li>
  {% endif %}

</ul>
{% endif %}
