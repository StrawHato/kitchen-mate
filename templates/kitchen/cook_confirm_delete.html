{% extends "base.html" %}

{% block content %}
  <h1>Delete Cook</h1>

  <p>Are you sure you want to delete the cook: {{ cook }}</p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, Delete" class="btn btn-danger">
    <a href="{{ cook.get_absolute_url }}" class="btn btn-secondary">Cancel</a>
  </form>

{% endblock %}
