{% extends "base.html" %}

{% block content %}
  <h1>Delete Dish</h1>
  <p>Are you sure you want to delete Dish: {{ dish }}</p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
    <a href="{{ dish.get_absolute_url }}" class="btn btn-secondary link-to-page">Cancel</a>
  </form>
{% endblock %}
