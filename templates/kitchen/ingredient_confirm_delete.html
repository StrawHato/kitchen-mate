{% extends "base.html" %}

{% block content %}
  <h1>Delete Ingredient</h1>
  <p>Are you sure you want to delete Ingredient: {{ ingredient }}</p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
    <a href="{% url 'kitchen:ingredient-list' %}" class="btn btn-secondary link-to-page">Cancel</a>
  </form>
{% endblock %}
